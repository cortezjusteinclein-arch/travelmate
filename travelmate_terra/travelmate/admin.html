<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TravelMate — Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --nav:#0E1622;--nav-2:#18222F;--nav-line:#22303F;--nav-txt:#9BA9B8;--nav-on:#fff;
  --blue:#0770E3;--blue-l:#0194F3;--blue-bg:#EAF4FE;
  --orange:#FF5E1F;--green:#00A651;--red:#E5330B;--amber:#F0A500;
  --ink:#0F1620;--ink-2:#5A6673;--ink-3:#8D97A2;--line:#E3E8ED;--bg:#F4F6F9;
  --sh:0 1px 2px rgba(15,22,32,.06),0 1px 3px rgba(15,22,32,.04);
  --sh-md:0 6px 20px rgba(15,22,32,.10);--sh-lg:0 20px 50px rgba(15,22,32,.22);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:13.5px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px}
a{color:var(--blue);text-decoration:none}
svg.i{width:1em;height:1em;fill:currentColor;flex:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#C9D2DB;border-radius:6px;border:3px solid var(--bg)}

.shell{display:flex;min-height:100vh}
.rail{width:236px;flex:none;background:var(--nav);color:var(--nav-txt);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;border-bottom:1px solid var(--nav-line)}
.brand .mk{width:30px;height:30px;border-radius:8px;background:var(--blue-l);color:#fff;display:grid;place-items:center;font-size:16px;font-weight:800}
.brand b{color:#fff;font-size:14.5px;letter-spacing:-.2px;display:block;line-height:1.2}
.brand small{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#6B7A8A}
.grp{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#5D6B7A;padding:16px 18px 6px;font-weight:700}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 18px;font-size:13px;font-weight:500;border-left:3px solid transparent;text-align:left}
.nav svg{font-size:15px;opacity:.85}
.nav:hover{background:var(--nav-2);color:#fff}
.nav.on{background:var(--nav-2);color:#fff;border-left-color:var(--blue-l);font-weight:600}
.nav .cnt{margin-left:auto;font-size:10.5px;font-weight:700;background:#243141;color:#9BA9B8;padding:1px 7px;border-radius:99px;min-width:22px;text-align:center}
.nav.on .cnt{background:var(--blue);color:#fff}
.nav .cnt.alert{background:var(--red);color:#fff}
.nav .chev{margin-left:8px;font-size:11px;opacity:.7;transition:transform .15s}
.nav .chev.up{transform:rotate(180deg)}
.subm{background:#0A111A;padding:4px 0 8px;border-left:3px solid var(--nav-line)}
.subm .sl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#4F5D6C;padding:8px 18px 3px 44px;font-weight:700}
.sbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 16px 6px 44px;font-size:12px;color:var(--nav-txt);font-weight:500}
.sbtn::before{content:"";width:6px;height:6px;border-radius:50%;border:1.5px solid #3A4A5B;flex:none}
.sbtn:hover{color:#fff;background:var(--nav-2)}
.sbtn.on{color:#fff;font-weight:600}
.sbtn.on::before{background:var(--blue-l);border-color:var(--blue-l)}
.sbtn .sc{margin-left:auto;font-size:10.5px;color:#6B7A8A}
.rail .end{margin-top:auto;padding:14px 18px;border-top:1px solid var(--nav-line);font-size:11.5px;color:#6B7A8A}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30}
.top h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.4px}
.top p{margin:2px 0 0;font-size:12px;color:var(--ink-3)}
.top .sp{flex:1}
.chip{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px;font-size:12px;font-weight:600}
.chip .av{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:10.5px;font-weight:700}
.body{padding:22px 26px 60px}

.panel{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);overflow:hidden}
.ph{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.ph h4{margin:0;font-size:13.5px;font-weight:700;letter-spacing:-.1px}
.ph .sp{flex:1}
.pb{padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;align-items:center;gap:10px}
.tiny{font-size:11.5px;color:var(--ink-3)}
.divider{height:1px;background:var(--line);margin:12px 0}
.rowsp{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:12.5px;gap:10px}
.rowsp b{font-weight:700}

.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px 16px;box-shadow:var(--sh)}
.kpi .lb{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.8px;margin:5px 0 3px;line-height:1}
.kpi .sub{font-size:11.5px;color:var(--ink-2)}
.kpi.warn{border-left:3px solid var(--amber)}
.kpi.bad{border-left:3px solid var(--red)}
.kpi.good{border-left:3px solid var(--green)}

.btn{border-radius:7px;padding:8px 14px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;border:1px solid transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.b-pri{background:var(--blue);color:#fff}
.b-pri:hover:not(:disabled){background:#0A5FBF}
.b-org{background:var(--orange);color:#fff}
.b-org:hover:not(:disabled){background:#E64A0E}
.b-out{border-color:var(--line);background:#fff;color:var(--ink-2)}
.b-out:hover:not(:disabled){background:#F6F8FA;color:var(--ink)}
.b-blue{border-color:#B7DBFB;background:#fff;color:var(--blue)}
.b-blue:hover:not(:disabled){background:var(--blue-bg)}
.b-red{border-color:#F5C3BA;background:#fff;color:var(--red)}
.b-red:hover:not(:disabled){background:#FEF2F0}
.b-sm{padding:5px 10px;font-size:11.5px;border-radius:6px}
.b-full{width:100%}
.inp{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 11px;background:#fff;color:var(--ink)}
.inp:focus{outline:2px solid #C7E4FC;border-color:var(--blue-l)}
.inp.sm{padding:6px 9px;font-size:12px}
.lb{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.frm{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.err{color:var(--red);font-size:11.5px;font-weight:600;margin-top:5px}
.hint{font-size:11px;color:var(--ink-3);margin-top:4px}
.bar-tools{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.bar-tools .sp{flex:1}
.search{position:relative;min-width:230px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:14px}
.search input{padding-left:31px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}
.seg button{padding:7px 13px;font-size:12px;font-weight:600;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--blue);color:#fff}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:5px;background:#EEF2F6;color:var(--ink-2);white-space:nowrap}
.tag.blue{background:var(--blue-bg);color:#0A5FBF}
.tag.green{background:#E4F7EE;color:#00713A}
.tag.amber{background:#FEF4E0;color:#96650A}
.tag.red{background:#FDECE9;color:#AE2510}
.tag.dot::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11.5px;color:var(--ink-2)}
.money{font-weight:700;color:var(--orange)}
.stars{color:var(--amber);letter-spacing:-1px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;background:#DCE7F2;color:#255B8C}

.scroll{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;background:#fff}
table.dt th{background:#F8FAFC;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
table.dt td{padding:11px 14px;border-bottom:1px solid #F1F4F7;font-size:12.5px;vertical-align:middle}
table.dt tr:last-child td{border-bottom:0}
table.dt tbody tr:hover{background:#FBFCFD}
table.dt tr.flag{background:#FFF9F8}
table.dt tr.flag:hover{background:#FEF3F1}
.acts{display:flex;gap:6px;justify-content:flex-end}
.thumb{width:42px;height:34px;border-radius:6px;display:grid;place-items:center;flex:none;color:rgba(255,255,255,.9);font-size:15px}
.beach{background:linear-gradient(150deg,#2BB3D6,#7FD9E8 45%,#F3E2B8)}
.pine{background:linear-gradient(150deg,#2E6B4F,#79B98C 60%,#D9E8C8)}
.food{background:linear-gradient(150deg,#C2410C,#F59E42 55%,#FFE0B8)}
.ramen{background:linear-gradient(150deg,#9C1B1B,#E05C4A 55%,#FFD3C2)}
.temple{background:linear-gradient(150deg,#6D3C9E,#B07BD6 55%,#F0DCF7)}
.falls{background:linear-gradient(150deg,#0E6E82,#38B0C4 55%,#C9EEF2)}
.city{background:linear-gradient(150deg,#334B72,#7A94C4 55%,#DCE5F5)}
.sun{background:linear-gradient(150deg,#B45309,#F0A24E 55%,#FDE7C4)}
.leaf{background:linear-gradient(150deg,#3F6212,#8DBF4A 55%,#E6F0CE)}
.rose{background:linear-gradient(150deg,#9D174D,#E0699A 55%,#FBD9E7)}
.empty{text-align:center;padding:40px 20px;color:var(--ink-2)}
.empty svg{font-size:30px;color:#C6D0D9;margin-bottom:9px}
.empty b{display:block;font-size:14px;color:var(--ink);margin-bottom:4px}

.cols{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:20px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px}
.col .v{font-size:11px;font-weight:700;color:var(--ink-2)}
.col .b{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--blue-l),var(--blue));min-height:3px}
.col .k{font-size:10.5px;color:var(--ink-3);font-weight:600}
.hb{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12.5px}
.hb .n{width:118px;flex:none;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .t{flex:1;height:7px;border-radius:4px;background:#EDF1F5;overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:4px;background:var(--blue-l)}
.hb .t i.green{background:var(--green)}.hb .t i.amber{background:var(--amber)}.hb .t i.red{background:var(--red)}
.hb .v{width:66px;text-align:right;font-weight:700;font-size:12px}
.donut{width:132px;height:132px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative}
.donut::after{content:"";position:absolute;width:84px;height:84px;border-radius:50%;background:#fff}
.donut .mid{position:relative;z-index:1;text-align:center}
.donut .mid b{display:block;font-size:21px;font-weight:800;letter-spacing:-.5px}
.donut .mid small{font-size:10px;color:var(--ink-3)}
.legend{display:grid;gap:7px}
.legend div{display:flex;align-items:center;gap:8px;font-size:12.5px}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}

.ovl{position:fixed;inset:0;background:rgba(10,18,28,.55);display:grid;place-items:center;z-index:200;padding:20px}
.modal{background:#fff;border-radius:12px;box-shadow:var(--sh-lg);width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column}
.modal .mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h4{margin:0;font-size:16px;font-weight:800;flex:1}
.modal .mb{padding:18px;overflow:auto}
.modal .mf{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:#FAFBFC;border-radius:0 0 12px 12px}
.toasts{position:fixed;right:20px;bottom:20px;z-index:300;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.toast{background:var(--ink);color:#fff;border-radius:9px;padding:11px 15px;font-size:12.5px;box-shadow:var(--sh-lg);max-width:330px;display:flex;gap:9px;align-items:flex-start;animation:pop .2s ease}
.toast.good{background:#04703A}.toast.bad{background:#9E2213}
.toast small{display:block;opacity:.85;font-size:11px;margin-top:2px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.gate{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 50% -5%,#17385F,#0E1622)}
.gbox{background:#fff;border-radius:14px;box-shadow:var(--sh-lg);width:100%;max-width:380px;padding:26px}
.gbox .bd{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.gbox .bd .mk{width:34px;height:34px;border-radius:9px;background:var(--blue-l);color:#fff;display:grid;place-items:center;font-size:17px;font-weight:800}
.gbox h3{margin:0;font-size:16px;font-weight:800}
.gbox .bd small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}

@media (max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
@media (max-width:820px){
  .rail{position:fixed;left:-240px;z-index:100;transition:left .2s}
  .rail.open{left:0}
  .body{padding:16px}.top{padding:12px 16px}
  .two,.three{grid-template-columns:1fr}
}
</style>
</head>

<symbol id="eye" viewBox="0 0 24 24"><path d="M12 5c-5 0-9 4.4-10 7 1 2.6 5 7 10 7s9-4.4 10-7c-1-2.6-5-7-10-7zm0 11a4 4 0 110-8 4 4 0 010 8zm0-2a2 2 0 100-4 2 2 0 000 4z"/></symbol>

<script>

const KEY=TMDB.KEY;
let DB,LAST="";
function load(){DB=TMDB.read();LAST=localStorage.getItem(KEY)||"";}
function save(){try{const t=JSON.stringify(DB);localStorage.setItem(KEY,t);LAST=t;if(window.SBR)SBR.push();}catch(e){toast("Storage is full, so this change was not saved","bad");}}
function fresh(){DB=TMDB.read();}
function nextId(t,pre,w){fresh();const pk=SCHEMA[t].pk;let m=0;DB[t].forEach(r=>{const n=parseInt(String(r[pk]).replace(/\D/g,""),10);if(!isNaN(n)&&n>m)m=n;});return pre+String(m+1).padStart(w,"0");}
function log(sql){DB._log.unshift({t:new Date().toISOString().slice(11,19),sql});if(DB._log.length>250)DB._log.pop();}
function audit(action,target,detail){
  fresh();
  DB._audit.unshift({At:new Date().toISOString().slice(0,19).replace("T"," "),By:(me()||{}).UserName||"—",Action:action,Target:target||"—",Detail:detail||""});
  if(DB._audit.length>400)DB._audit.pop();save();
}
function insert(t,row){fresh();DB[t].push(row);log("INSERT INTO "+t+" …");save();return row;}
function update(t,id,patch){fresh();const pk=SCHEMA[t].pk,r=DB[t].find(x=>x[pk]===id);if(!r)return null;Object.assign(r,patch);log("UPDATE "+t+" SET "+Object.keys(patch).join(", ")+" WHERE "+pk+" = '"+id+"';");save();return r;}
function remove(t,id){fresh();const pk=SCHEMA[t].pk,i=DB[t].findIndex(x=>x[pk]===id);if(i<0)return false;DB[t].splice(i,1);log("DELETE FROM "+t+" WHERE "+pk+" = '"+id+"';");save();return true;}
function sel(t,fn){return DB[t].filter(fn||(()=>true));}
function one(t,id){const pk=SCHEMA[t].pk;return DB[t].find(x=>x[pk]===id)||null;}
function me(){return DB._session?one("USERS",DB._session):null;}
function isAdmin(){const u=me();return !!u&&u.Role==="Administrator";}

const TKEY=KEY+":traffic";
let TLAST=(()=>{try{return localStorage.getItem(TKEY)||"";}catch(e){return "";}})();
function TR(){let t=null;try{t=JSON.parse(localStorage.getItem(TKEY));}catch(e){}
  t=t&&typeof t==="object"?t:{};["visits","logins"].forEach(k=>{if(!Array.isArray(t[k]))t[k]=[];});
  if(!t.live||typeof t.live!=="object")t.live={};return t;}
function trSave(t){try{localStorage.setItem(TKEY,JSON.stringify(t));TLAST=localStorage.getItem(TKEY);}catch(e){}}
function trLogin(email,u,ok){if(window.SBR)SBR.logLogin(email,u,ok);const t=TR();
  t.logins.unshift({At:new Date().toISOString(),UserID:u?u.UserID:"",UserName:u?u.UserName:"",Email:email,Role:u?u.Role:"",Result:ok?"success":"failed",Source:"admin"});
  if(ok)t.lastSession=u.UserID;if(t.logins.length>1000)t.logins.length=1000;trSave(t);}
function syncTraffic(){let r="";try{r=localStorage.getItem(TKEY)||"";}catch(e){return;}
  if(r===TLAST)return;TLAST=r;if(isAdmin()&&(VIEW==="traffic"||VIEW==="dashboard"))scheduleRender();}
function lday(d){d=d===undefined?new Date():new Date(d);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function pageName(p){p=String(p||"").replace(/\.html?$/,"");return(p===""||p==="index")?"Home":p.charAt(0).toUpperCase()+p.slice(1);}
function lastLogin(uid){const l=TR().logins.find(x=>x.UserID===uid&&x.Result==="success");return l?fdt(l.At):'<span class="tiny">never</span>';}
function loginCount(uid){return TR().logins.filter(x=>x.UserID===uid&&x.Result==="success").length;}
function tStats(days){
  const t=TR(),now=Date.now(),keys=[],vd={},lg={};
  for(let i=days-1;i>=0;i--)keys.push(lday(now-i*864e5));
  keys.forEach(k=>{vd[k]=0;lg[k]=0;});
  const from=keys[0],td=lday();
  const pv=t.visits.filter(v=>lday(v.At)>=from);
  pv.forEach(v=>{const k=lday(v.At);if(k in vd)vd[k]++;});
  const ok=t.logins.filter(l=>l.Result==="success"&&lday(l.At)>=from);
  const bad=t.logins.filter(l=>l.Result==="failed"&&lday(l.At)>=from);
  ok.forEach(l=>{const k=lday(l.At);if(k in lg)lg[k]++;});
  const tv=t.visits.filter(v=>lday(v.At)===td);
  return{t,keys,vd,lg,pv,ok,bad,uniq:new Set(pv.map(v=>v.Vid)).size,
    todayV:tv.length,todayU:new Set(tv.map(v=>v.Vid)).size,
    todayL:t.logins.filter(l=>l.Result==="success"&&lday(l.At)===td).length,
    online:Object.values(t.live).filter(x=>x.at>now-45000)};
}
function trafficKpis(){const s=tStats(14);
  return '<div class="grid g4" style="margin-bottom:16px">'+
   kpi("Website visits",s.t.visits.length,s.todayV+" today · "+s.todayU+" unique visitors")+
   kpi("Logins (14 days)",s.ok.length,s.todayL+" today · "+s.bad.length+" failed",s.bad.length>5?"warn":"")+
   kpi("Online now",s.online.length,s.online.length?"browsing right now":"nobody on the site",s.online.length?"good":"")+
   kpi("Unique visitors (14 days)",s.uniq,'<a href="#" onclick="nav(\'traffic\');return false">Open full report</a>')+'</div>';}
function vTraffic(){
  const days=Number(F.range)||14,s=tStats(days),q=F.q.toLowerCase();
  const pages={};s.pv.forEach(v=>{const n=pageName(v.Page);pages[n]=(pages[n]||0)+1;});
  const topP=Object.entries(pages).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const guest=s.pv.filter(v=>!v.UserID).length,mem=s.pv.length-guest;
  const per={};s.ok.forEach(l=>{const k=l.UserName||l.Email||"—";per[k]=(per[k]||0)+1;});
  const topU=Object.entries(per).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const rows=s.t.logins.filter(l=>(!F.lres||l.Result===F.lres)&&(!q||(l.UserName+" "+l.Email+" "+l.Role).toLowerCase().includes(q))).slice(0,300);
  const lab=k=>k.slice(8);
  return tools(seg("range",[["7","7 days"],["14","14 days"],["30","30 days"]])+'<span class="sp"></span>'+
    '<button class="btn b-out b-sm" onclick="download(\'visits.csv\',csv(TR().visits,[\'At\',\'Vid\',\'Page\',\'UserID\']),\'text/csv\')"><svg class="i"><use href="#down"/></svg> Visits CSV</button>'+
    '<button class="btn b-red b-sm" onclick="clearTraffic()">Clear traffic data</button>')+
  '<div class="grid g4" style="margin-bottom:16px">'+
   kpi("Total visits",s.pv.length,"last "+days+" days · "+s.t.visits.length+" all time")+
   kpi("Unique visitors",s.uniq,s.todayU+" today")+
   kpi("Successful logins",s.ok.length,s.todayL+" today","good")+
   kpi("Failed logins",s.bad.length,s.bad.length?"check for guessing attempts":"none","" +(s.bad.length>5?"bad":s.bad.length?"warn":"good"))+
  '</div><div class="grid g2" style="margin-bottom:16px">'+
   '<div class="panel"><div class="ph"><h4>Visits per day</h4></div><div class="pb">'+cols(0,s.keys.map(k=>[lab(k),s.vd[k]]))+'</div></div>'+
   '<div class="panel"><div class="ph"><h4>Logins per day</h4></div><div class="pb">'+cols(0,s.keys.map(k=>[lab(k),s.lg[k]]))+'</div></div>'+
  '</div><div class="grid g3" style="margin-bottom:16px">'+
   '<div class="panel"><div class="ph"><h4>Most visited pages</h4></div><div class="pb">'+
    (topP.length?topP.map(x=>hbar(x[0],x[1],topP[0][1])).join(""):'<div class="tiny">No visits recorded yet.</div>')+'</div></div>'+
   '<div class="panel"><div class="ph"><h4>Visitors</h4><span class="sp"></span><span class="tag green dot">'+s.online.length+' online</span></div><div class="pb">'+
    hbar("Guests",guest,Math.max(1,s.pv.length),guest)+hbar("Signed in",mem,Math.max(1,s.pv.length),mem,"green")+
    (s.online.length?'<div class="divider"></div>'+s.online.map(o=>'<div class="rowsp"><span>'+esc(pageName(o.page))+'</span><span class="tiny">'+(o.uid?esc((one("USERS",o.uid)||{}).UserName||o.uid):"guest")+'</span></div>').join(""):"")+'</div></div>'+
   '<div class="panel"><div class="ph"><h4>Most active accounts</h4><span class="sp"></span><span class="tiny">logins</span></div><div class="pb">'+
    (topU.length?topU.map(x=>hbar(x[0],x[1],topU[0][1],x[1],"green")).join(""):'<div class="tiny">No logins yet.</div>')+'</div></div>'+
  '</div>'+
  tools(searchBox("Search name, email or role")+selectBox("lres",[["","All results"],["success","Successful"],["failed","Failed"]])+
    '<span class="sp"></span><span class="tiny">'+rows.length+' sign-in entries</span>'+
    '<button class="btn b-out b-sm" onclick="download(\'logins.csv\',csv(TR().logins,[\'At\',\'UserID\',\'UserName\',\'Email\',\'Role\',\'Result\',\'Source\']),\'text/csv\')"><svg class="i"><use href="#down"/></svg> Logins CSV</button>')+
  '<div class="panel"><div class="scroll">'+(rows.length?
   '<table class="dt"><thead><tr><th>When</th><th>User</th><th>Email</th><th>Role</th><th>Result</th><th>From</th></tr></thead><tbody>'+
   rows.map(l=>'<tr'+(l.Result==="failed"?' class="flag"':'')+'><td class="mono">'+esc(fdt(l.At))+'</td><td>'+(l.UserName?'<b>@'+esc(l.UserName)+'</b>':'<span class="tiny">unknown</span>')+'</td>'+
     '<td>'+esc(l.Email||"—")+'</td><td>'+esc(l.Role||"—")+'</td>'+
     '<td><span class="tag dot '+(l.Result==="success"?"green":"red")+'">'+(l.Result==="success"?"Success":"Failed")+'</span></td><td class="tiny">'+esc(l.Source||"site")+'</td></tr>').join("")+'</tbody></table>'
    :empty("shield","No sign-ins recorded yet","Logins appear here once tracker.js is on your login and home pages."))+'</div></div>';
}
function clearTraffic(){if(!confirm("Delete all visit and login history?"))return;trSave({visits:[],logins:[],live:{},lastSession:me()?me().UserID:""});audit("Cleared traffic data","","");toast("Traffic data cleared");render();}

const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function peso(n){return "₱"+Number(n||0).toLocaleString("en-PH",{maximumFractionDigits:0});}
function today(){return new Date().toISOString().slice(0,10);}
function fdate(d){if(!d)return "—";const x=new Date(String(d).length===10?d+"T00:00":d);return isNaN(x)?d:x.toLocaleDateString("en-PH",{day:"numeric",month:"short",year:"numeric"});}
function fdt(d){if(!d)return "—";const x=new Date(d);return isNaN(x)?d:x.toLocaleString("en-PH",{day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"});}
function ini(u){return u?((u.FirstName||"?")[0]+(u.LastName||"")[0]||"?").toUpperCase():"?";}
function stars(n){n=Math.round(Number(n)||0);return "★★★★★".slice(0,n)+"<span style='color:#DEE4EA'>"+"★★★★★".slice(0,5-n)+"</span>";}
function nights(a,b){return Math.max(0,Math.round((new Date(b)-new Date(a))/864e5));}
function toast(msg,kind,sub){
  const el=document.createElement("div");el.className="toast "+(kind||"");
  el.innerHTML='<svg class="i" style="margin-top:2px"><use href="#'+(kind==="bad"?"x":"check")+'"/></svg><div>'+esc(msg)+(sub?'<small>'+esc(sub)+'</small>':'')+'</div>';
  $("#toasts").appendChild(el);el.onclick=()=>el.remove();setTimeout(()=>el.remove(),kind==="bad"?15000:4000);
}
function modal(title,body,foot,wide){
  $("#layer").innerHTML='<div class="ovl" onclick="if(event.target===this)closeModal()"><div class="modal"'+(wide?' style="max-width:760px"':'')+'>'+
   '<div class="mh"><h4>'+esc(title)+'</h4><button class="btn b-out b-sm" onclick="closeModal()"><svg class="i"><use href="#x"/></svg></button></div>'+
   '<div class="mb">'+body+'</div>'+(foot?'<div class="mf">'+foot+'</div>':'')+'</div></div>';
}
function closeModal(){$("#layer").innerHTML="";}
function detailOf(lid){const l=one("LISTING",lid);if(!l)return null;const t=l.Category==="Hotel"?"HOTELS":l.Category==="Restaurant"?"RESTAURANTS":"ATTRACTIONS";return DB[t].find(r=>r.ListingID===lid)||null;}
function nameOf(lid){const d=detailOf(lid);return d?(d.HotelName||d.RestaurantName||d.AttractionName):"(removed)";}
function addrOf(lid){const d=detailOf(lid);return d?(d.Address||""):"";}
function skinOf(lid){const l=one("LISTING",lid);if(!l)return "city";const n=parseInt(lid.replace(/\D/g,""),10)||1;
  if(l.Category==="Hotel")return ["beach","pine","sun","city"][n%4];
  if(l.Category==="Restaurant")return ["food","ramen","rose"][n%3];
  return ["temple","falls","leaf"][n%3];}
function iconOf(c){return c==="Hotel"?"bed":c==="Restaurant"?"fork":"ticket";}
function priceOf(lid){const l=one("LISTING",lid),d=detailOf(lid);if(!d)return 0;
  if(l.Category==="Hotel")return Number(d.NightlyRate)||0;
  if(l.Category==="Attraction")return Number(d.EntranceFee)||0;
  const m=String(d.PriceRange).match(/[\d,]+/);return m?Number(m[0].replace(/,/g,"")):0;}
function reviewsFor(lid){
  const l=one("LISTING",lid),d=detailOf(lid);if(!l||!d)return [];
  let ids=[];
  if(l.Category==="Hotel")ids=sel("HOTEL_REVIEWS",r=>r.HotelID===d.HotelID).map(r=>r.ReviewID);
  if(l.Category==="Restaurant")ids=sel("RESTAURANT_REVIEWS",r=>r.RestaurantID===d.RestaurantID).map(r=>r.ReviewID);
  if(l.Category==="Attraction")ids=sel("ATTRACTION_REVIEWS",r=>r.AttractionID===d.AttractionID).map(r=>r.ReviewID);
  return ids.map(i=>one("REVIEWS",i)).filter(Boolean);}
function ratingFor(lid){const rs=reviewsFor(lid).filter(r=>!r.Flagged);
  return rs.length?{avg:Math.round(rs.reduce((s,r)=>s+Number(r.Rating),0)/rs.length*10)/10,n:rs.length}:{avg:null,n:0};}
function listingOfReview(rid){
  let b=one("HOTEL_REVIEWS",rid);if(b){const hh=DB.HOTELS.find(x=>x.HotelID===b.HotelID);return hh?hh.ListingID:null;}
  b=one("RESTAURANT_REVIEWS",rid);if(b){const r=DB.RESTAURANTS.find(x=>x.RestaurantID===b.RestaurantID);return r?r.ListingID:null;}
  b=one("ATTRACTION_REVIEWS",rid);if(b){const a=DB.ATTRACTIONS.find(x=>x.AttractionID===b.AttractionID);return a?a.ListingID:null;}
  return null;}
function bridgeOf(rid){
  if(one("HOTEL_REVIEWS",rid))return "HOTEL_REVIEWS";
  if(one("RESTAURANT_REVIEWS",rid))return "RESTAURANT_REVIEWS";
  if(one("ATTRACTION_REVIEWS",rid))return "ATTRACTION_REVIEWS";
  return null;}
function deps(uid){return{
  BOOKINGS:sel("BOOKINGS",b=>b.UserID===uid).length,
  REVIEWS:sel("REVIEWS",r=>r.UserID===uid).length,
  TRIP_PLANS:sel("TRIP_PLANS",t=>t.UserID===uid).length,
  LISTING:sel("LISTING",l=>l.HostUserID===uid).length,
  FORUM_POSTS:sel("FORUM_POSTS",p=>p.UserID===uid).length,
  FORUM_REPLIES:sel("FORUM_REPLIES",r=>r.UserID===uid).length,
  PHOTOS:sel("PHOTOS",p=>p.UserID===uid).length};}

let VIEW="dashboard", F={q:"",role:"",cat:"",lstat:"",bstat:"",rvf:"all",fmt:"posts",tbl:"BOOKINGS",range:"14",lres:""};
const NAV=[
  ["grp","Monitor"],
  ["dashboard","Dashboard","grid"],
  ["reports","Reports","chart"],
  ["traffic","Visits & logins","user"],
  ["grp","Manage"],
  ["users","Users","user"],
  ["listings","Listings","bed"],
  ["bookings","Bookings","cal"],
  ["trips","Trip plans","map"],
  ["grp","Moderate"],
  ["reviews","Reviews","star"],
  ["forum","Forum","chat"],
  ["photos","Photos","photo"],
  ["grp","System"],
  ["tables","Tables","db"],
  ["activity","Activity log","shield"]
];
const META={
  dashboard:["Dashboard","Everything happening on the platform right now"],
  traffic:["Visits & logins","Website traffic, who is online, and every sign-in attempt"],
  reports:["Reports","Booking value, ratings and catalog breakdowns"],
  users:["Users","Traveler, host and administrator accounts"],
  listings:["Listings","Hotels, restaurants and attractions in the catalog"],
  bookings:["Bookings","Reservations and their status"],
  trips:["Trip plans","Itineraries travelers have saved"],
  reviews:["Reviews","Ratings and written reviews left by travelers"],
  forum:["Forum","Discussions and replies from the community"],
  photos:["Photos","Images attached to reviews and forum posts"],
  tables:["Tables","Browse and export the raw data"],
  activity:["Activity log","A record of every action taken in this console"]
};
function counts(){
  return{
    users:DB.USERS.length,
    listings:sel("LISTING",l=>l.ListingStatus==="Pending Review").length||DB.LISTING.length,
    listingsAlert:sel("LISTING",l=>l.ListingStatus==="Pending Review").length>0,
    bookings:DB.BOOKINGS.length,
    trips:DB.TRIP_PLANS.length,
    reviews:sel("REVIEWS",r=>r.Flagged).length||DB.REVIEWS.length,
    reviewsAlert:sel("REVIEWS",r=>r.Flagged).length>0,
    forum:sel("FORUM_POSTS",p=>p.Flagged).length||DB.FORUM_POSTS.length,
    forumAlert:sel("FORUM_POSTS",p=>p.Flagged).length>0,
    photos:DB.PHOTOS.length,
    tables:TABLES.length,
    activity:DB._audit.length,
    dashboard:null,reports:null
  };
}
let OPEN="";
const SUB={
  users:[["role","",[["","All users"],["Traveler","Travelers"],["Host","Hosts"],["Administrator","Administrators"]]]],
  listings:[["lstat","Status",[["","All statuses"],["Published","Published"],["Pending Review","Pending review"],["Delisted","Delisted"]]],
            ["cat","Category",[["","All categories"],["Hotel","Hotels"],["Restaurant","Restaurants"],["Attraction","Attractions"]]]],
  bookings:[["bstat","",[["","All bookings"],["Requested","Requested"],["Confirmed","Confirmed"],["Completed","Completed"],["Cancelled","Cancelled"]]]],
  reviews:[["rvf","",[["all","All reviews"],["flag","Reported"],["low","Low rated (3★ or less)"]]]],
  forum:[["fmt","",[["posts","Discussions"],["replies","Replies"]]]]
};
function subCount(v,f,val){
  if(f==="role")return val?sel("USERS",u=>u.Role===val).length:DB.USERS.length;
  if(f==="cat")return val?sel("LISTING",l=>l.Category===val).length:DB.LISTING.length;
  if(f==="lstat")return val?sel("LISTING",l=>l.ListingStatus===val).length:DB.LISTING.length;
  if(f==="bstat")return val?sel("BOOKINGS",b=>b.BookingStatus===val).length:DB.BOOKINGS.length;
  if(f==="rvf")return val==="flag"?sel("REVIEWS",r=>r.Flagged).length:val==="low"?sel("REVIEWS",r=>Number(r.Rating)<=3).length:DB.REVIEWS.length;
  if(f==="fmt")return val==="replies"?DB.FORUM_REPLIES.length:DB.FORUM_POSTS.length;
  return "";}
function subMenu(v){
  return '<div class="subm">'+SUB[v].map(g=>(g[1]?'<div class="sl">'+g[1]+'</div>':'')+
    g[2].map(o=>'<button class="sbtn '+(VIEW===v&&F[g[0]]===o[0]?"on":"")+'" onclick="setSub(\''+v+'\',\''+g[0]+'\',\''+o[0]+'\')">'+o[1]+
     '<span class="sc">'+subCount(v,g[0],o[0])+'</span></button>').join("")).join("")+'</div>';}
function setSub(v,f,val){F[f]=val;F.q="";VIEW=v;OPEN=v;render();window.scrollTo(0,0);}

function render(){
  const ae=document.activeElement,keep=ae&&ae.closest&&ae.closest(".search")?{p:ae.selectionStart}:null;
  closeModal();
  if(!isAdmin()){$("#app").innerHTML=gate();return;}
  const c=counts(),m=META[VIEW]||META.dashboard;
  const body=({dashboard:vDashboard,traffic:vTraffic,reports:vReports,users:vUsers,listings:vListings,bookings:vBookings,
    trips:vTrips,reviews:vReviews,forum:vForum,photos:vPhotos,tables:vTables,activity:vActivity}[VIEW]||vDashboard)();
  $("#app").innerHTML=
   '<div class="shell"><aside class="rail" id="rail">'+

function saveUser(id){
  const fn=$("#ufn").value.trim(),ln=$("#uln").value.trim(),un=$("#uun").value.trim(),em=$("#uem").value.trim(),pw=$("#upw").value;
  if(!fn||!ln||!un||!em){$("#uerr").innerHTML='<div class="err">Name, display name and email are all required.</div>';return;}
  if(DB.USERS.some(u=>u.UserID!==id&&u.Email.toLowerCase()===em.toLowerCase())){$("#uerr").innerHTML='<div class="err">Another account already uses that email.</div>';return;}
  if(DB.USERS.some(u=>u.UserID!==id&&u.UserName.toLowerCase()===un.toLowerCase())){$("#uerr").innerHTML='<div class="err">That display name is taken.</div>';return;}
  const patch={FirstName:fn,LastName:ln,UserName:un,Email:em,Role:$("#uro").value};
  if(pw){$("#uerr").innerHTML='<div class="err">Passwords are managed by Supabase: Authentication → Users → ⋯ → Send password recovery.</div>';return;}
  update("USERS",id,patch);audit("Edited user","@"+un,pw?"details and password":"details");
  closeModal();toast("User updated","good");render();
}

function createUser(){
  const fn=$("#nfn").value.trim(),ln=$("#nln").value.trim(),un=$("#nun").value.trim(),em=$("#nem").value.trim(),pw=$("#npw").value;
  if(!fn||!ln||!un||!em){$("#nerr").innerHTML='<div class="err">Fill in every field.</div>';return;}

function doDeleteUser(id){
  const u=one("USERS",id);
  sel("LISTING",l=>l.HostUserID===id).forEach(l=>purgeListing(l.ListingID));
  sel("REVIEWS",r=>r.UserID===id).forEach(r=>purgeReview(r.ReviewID));
  sel("FORUM_POSTS",p=>p.UserID===id).forEach(p=>purgePost(p.PostID));
  sel("FORUM_REPLIES",r=>r.UserID===id).forEach(r=>remove("FORUM_REPLIES",r.ReplyID));
  sel("TRIP_PLANS",t=>t.UserID===id).forEach(t=>{sel("TRIP_PLAN_ITEMS",i=>i.TripID===t.TripID).forEach(i=>remove("TRIP_PLAN_ITEMS",i.ItemID));remove("TRIP_PLANS",t.TripID);});
  sel("BOOKINGS",b=>b.UserID===id).forEach(b=>remove("BOOKINGS",b.BookingID));
  sel("PHOTOS",p=>p.UserID===id).forEach(p=>remove("PHOTOS",p.PhotoID));
  remove("USERS",id);audit("Deleted user","@"+u.UserName,"with dependent rows");
  closeModal();toast("Account removed","good");render();
}

function afterSync(okMsg,failMsg){
  return (window.SBR?SBR.flush():Promise.resolve([])).then(errs=>{
    const e=(errs||[]).find(x=>/^LISTING /.test(x))||(errs||[])[0];
    if(e)toast(failMsg,"bad",String(e).replace(/^LISTING \S+: /,""));else toast(okMsg,"good");
  });
}

function saveListing(id){
  const l=one("LISTING",id),d=detailOf(id),name=$("#ln").value.trim();
  if(!name){toast("A listing needs a name","bad");return;}
  update("LISTING",id,{ListingStatus:$("#lst").value});
  const t=l.Category==="Hotel"?"HOTELS":l.Category==="Restaurant"?"RESTAURANTS":"ATTRACTIONS";
  const pk=SCHEMA[t].pk,pv=d[pk];
  const patch={Address:$("#lad").value.trim(),Description:$("#ld")?$("#ld").value.trim():d.Description};
  if(l.Category==="Hotel"){patch.HotelName=name;patch.StarRating=Number($("#ls").value);patch.NightlyRate=Number($("#lr").value)||0;
    patch.ContactInfo=$("#lc").value.trim();patch.Amenities=$("#la").value.trim();
    patch.PriceRange=peso(patch.NightlyRate)+"–"+peso(Math.round(patch.NightlyRate*1.5));}
  else if(l.Category==="Restaurant"){patch.RestaurantName=name;patch.CuisineType=$("#lcu").value.trim();patch.PriceRange=$("#lpr").value.trim();}
  else{patch.AttractionName=name;patch.Category=$("#lty").value.trim();patch.EntranceFee=Number($("#lfe").value)||0;}
  update(t,pv,patch);audit("Edited listing",name,id);closeModal();toast("Listing updated","good");render();
}

function createListing(){
  const c=$("#ncat").value,name=$("#nname").value.trim(),addr=$("#naddr").value.trim(),desc=$("#ndesc").value.trim();
  if(!name||!addr){$("#nlerr").innerHTML='<div class="err">Name and address are required.</div>';return;}
  const lid=nextId("LISTING","L",3);
  insert("LISTING",{ListingID:lid,Category:c,ListingStatus:$("#nstat").value,HostUserID:$("#nhost").value});
  if(c==="Hotel"){const rate=Number($("#nrate").value)||0;
    insert("HOTELS",{HotelID:nextId("HOTELS","H",3),ListingID:lid,HotelName:name,StarRating:Number($("#nstar").value),
      PriceRange:peso(rate)+"–"+peso(Math.round(rate*1.5)),NightlyRate:rate,Description:desc,Amenities:$("#namen").value.trim(),
      ImageURL:lid.toLowerCase()+".jpg",ContactInfo:$("#ncontact").value.trim(),Address:addr});}
  else if(c==="Restaurant")
    insert("RESTAURANTS",{RestaurantID:nextId("RESTAURANTS","R",3),ListingID:lid,RestaurantName:name,CuisineType:$("#ncui").value.trim(),
      PriceRange:$("#npr").value.trim(),Address:addr,Rating:null,ImageURL:lid.toLowerCase()+".jpg"});
  else
    insert("ATTRACTIONS",{AttractionID:nextId("ATTRACTIONS","A",3),ListingID:lid,AttractionName:name,Category:$("#nty").value.trim(),
      Address:addr,Description:desc,ImageURL:lid.toLowerCase()+".jpg",Rating:null,EntranceFee:Number($("#nfee").value)||0});
  audit("Created listing",name,lid+" · "+c);closeModal();toast("Listing "+lid+" created","good");render();
}

function purgeListing(id){
  const l=one("LISTING",id),d=detailOf(id);
  reviewsFor(id).forEach(r=>purgeReview(r.ReviewID));
  sel("BOOKINGS",b=>b.ListingID===id).forEach(b=>remove("BOOKINGS",b.BookingID));
  sel("TRIP_PLAN_ITEMS",i=>i.ListingID===id).forEach(i=>update("TRIP_PLAN_ITEMS",i.ItemID,{ListingID:null,ItemType:"Custom"}));

function saveBooking(id){
  const b=one("BOOKINGS",id),i=$("#bi").value,o=$("#bo").value,st=$("#bs").value;
  const hotel=((one("LISTING",b.ListingID)||{}).Category||"Hotel")==="Hotel";
  if(hotel?!(o>i):(o<i)){$("#berr").innerHTML='<div class="err">'+(hotel?"Check-out must be after check-in.":"The end date cannot be before the start date.")+'</div>';return;}
  const clash=sel("BOOKINGS",x=>x.ListingID===b.ListingID&&x.BookingID!==id&&
    (x.BookingStatus==="Confirmed"||x.BookingStatus==="Completed")&&i<x.CheckOutDate&&o>x.CheckInDate);
  if(clash.length&&st!=="Cancelled"){$("#berr").innerHTML='<div class="err">Those dates clash with '+clash[0].BookingID+'.</div>';return;}
  update("BOOKINGS",id,{CheckInDate:i,CheckOutDate:o,NumGuests:Number($("#bg").value)||1,TotalPrice:Number($("#bt").value)||0,BookingStatus:st});
  audit("Edited booking",id,"");closeModal();toast("Booking updated","good");render();
}

function expAll(){const c={};TABLES.forEach(t=>c[t]=DB[t]);download("travelmate.json",JSON.stringify(c,null,2),"application/json");}
function expSQL(){
  const type=c=>/ID$/.test(c)?"VARCHAR(10)":/Date|Time/.test(c)?"DATE":/Price|Rate|Fee|Rating|Count|Guests|Star/.test(c)?"DECIMAL(10,2)":/Text|Description|Notes|Amenities/.test(c)?"TEXT":"VARCHAR(255)";
  let out="-- TravelMate schema and data\n\n";
  TABLES.forEach(t=>{
    out+="CREATE TABLE "+t+" (\n"+SCHEMA[t].cols.map(c=>"  "+c+" "+type(c)+(c===SCHEMA[t].pk?" PRIMARY KEY":"")).join(",\n")+"\n);\n\n";
  });
  TABLES.forEach(t=>{
    DB[t].forEach(r=>{
      const vals=SCHEMA[t].cols.map(c=>r[c]===null||r[c]===undefined||r[c]===""?"NULL":typeof r[c]==="number"?r[c]:typeof r[c]==="boolean"?(r[c]?1:0):"'"+String(r[c]).replace(/'/g,"''")+"'");
      out+="INSERT INTO "+t+" ("+SCHEMA[t].cols.join(", ")+") VALUES ("+vals.join(", ")+");\n";
    });
    out+="\n";
  });
  download("travelmate.sql",out,"text/plain");
}

const WATCH=[
  ["USERS","UserID","New user registered",r=>"@"+r.UserName+" · "+r.Email],
  ["BOOKINGS","BookingID","New booking",r=>r.BookingID+" · "+nameOf(r.ListingID)],
  ["TRIP_PLANS","TripID","New trip plan",r=>r.TripName],
  ["REVIEWS","ReviewID","New review",r=>r.Title],
  ["FORUM_POSTS","PostID","New forum post",r=>r.Title],
  ["LISTING","ListingID","Listing submitted",r=>nameOf(r.ListingID)]
];
function announce(old,nw){
  let shown=0;
  WATCH.forEach(w=>{
    const seen=new Set((old[w[0]]||[]).map(r=>r[w[1]]));
    (nw[w[0]]||[]).filter(r=>!seen.has(r[w[1]])).forEach(r=>{if(shown++<4)toast(w[2],"good",w[3](r));});
  });
}

function scheduleRender(){
  clearTimeout(RT);
  const typing=()=>{const a=document.activeElement;return a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&!(a.closest&&a.closest(".search"));};
  const go=()=>{if(!isAdmin())return;if($("#layer").innerHTML.trim()||typing()){RT=setTimeout(go,1200);return;}render();};
  go();
}
function syncStore(){
  let raw;try{raw=localStorage.getItem(KEY);}catch(e){return;}
  if(!raw||raw===LAST)return;
  let nw;try{nw=JSON.parse(raw);}catch(e){return;}
  TABLES.forEach(t=>{if(!Array.isArray(nw[t]))nw[t]=[];});
  if(!Array.isArray(nw._log))nw._log=[];if(!Array.isArray(nw._audit))nw._audit=[];
  const old=DB;LAST=raw;DB=nw;
  if(isAdmin())announce(old,nw);
  scheduleRender();
}
window.addEventListener("storage",e=>{if(e.key===KEY||e.key===null)syncStore();if(e.key===TKEY||e.key===null)syncTraffic();});
setInterval(()=>{syncStore();syncTraffic();},1000);

load();
render();
SBR.init().then(()=>{load();render();}).catch(e=>toast("Supabase: "+e.message,"bad"));
window.addEventListener("resize",()=>{const b=$("#burger");if(b)b.style.display=window.innerWidth<820?"inline-flex":"none";});
</script>
